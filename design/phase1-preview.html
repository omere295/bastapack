<title>BastaPack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Suez+One&display=swap">
<style>
/* Layout: a packing-station tool. Sticky header, then day sections of order cards; one column, wide enough for a tablet held upright. */
:root {
  --bg: #EAF0F1;          /* ice */
  --surface: #FFFFFF;
  --surface-2: #F4F8F9;
  --ink: #0F2A33;          /* deep water */
  --muted: #587079;
  --line: #D3DFE2;
  --accent: #CF4F33;       /* salmon flesh */
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE6E0;
  --sea: #1C5D6C;          /* business */
  --sea-soft: #DDEDF0;
  --sea-ink: #FFFFFF;
  --danger-ink: #FFFFFF;
  --ok: #23774A;
  --ok-soft: #DFF1E6;
  --danger: #AE2A20;
  --danger-soft: #FBE3E0;
  --pick-bg: #F6EBD4;      /* self-pickup */
  --pick-line: #DFC48D;
  --pick-ink: #6E4A0E;
  --shadow: 0 1px 2px rgba(15, 42, 51, .06), 0 4px 14px rgba(15, 42, 51, .06);
  --f-display: "Suez One", "IBM Plex Sans Hebrew", "Arial Hebrew", serif;
  --f-body: "IBM Plex Sans Hebrew", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B181C; --surface: #12232A; --surface-2: #172C34; --ink: #E3EDEF; --muted: #91A8AF; --line: #24404A;
    --accent: #F07A5E; --accent-ink: #1A0B06; --accent-soft: #3A1D16; --sea: #5AAFC1; --sea-soft: #15333B; --sea-ink: #061A1F; --danger-ink: #2A0A07;
    --ok: #6DCB92; --ok-soft: #153626; --danger: #F2897F; --danger-soft: #3C1613;
    --pick-bg: #33290F; --pick-line: #6A5424; --pick-ink: #F1D69C; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B181C; --surface: #12232A; --surface-2: #172C34; --ink: #E3EDEF; --muted: #91A8AF; --line: #24404A;
  --accent: #F07A5E; --accent-ink: #1A0B06; --accent-soft: #3A1D16; --sea: #5AAFC1; --sea-soft: #15333B; --sea-ink: #061A1F; --danger-ink: #2A0A07;
  --ok: #6DCB92; --ok-soft: #153626; --danger: #F2897F; --danger-soft: #3C1613;
  --pick-bg: #33290F; --pick-line: #6A5424; --pick-ink: #F1D69C; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { min-height: 100%; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* preview strip + header */
.strip { background: var(--surface-2); color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); }
.strip .wrap { padding-block: 6px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.strip button { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; min-height: 60px; }
.brand { font-family: var(--f-display); font-size: 24px; letter-spacing: .5px; color: var(--accent); background: none; border: 0; padding: 0; }
.crumb { font-weight: 600; font-size: 18px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.role.admin { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--ink); }
.ghost:hover { background: var(--surface-2); }

main { padding-block: 20px 120px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sea { background: var(--sea); color: var(--sea-ink); border-color: var(--sea); }
.btn.danger { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.linkbtn { background: none; border: 0; color: var(--sea); font-weight: 600; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn.danger { color: var(--danger); }

/* login */
.login { max-width: 420px; margin: 8vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); display: grid; gap: 16px; }
.login h1 { font-family: var(--f-display); font-weight: 400; color: var(--accent); font-size: 40px; margin: 0; line-height: 1; }
.login p { margin: 0; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; }
.field input, .field select, .field textarea { min-height: 48px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.hint { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 12px; font-size: 14px; color: var(--muted); display: grid; gap: 8px; }
.hint .row { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: var(--danger); font-size: 14px; font-weight: 600; }

/* home */
.home { display: grid; gap: 20px; }
.bigs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.big { border: 0; border-radius: 18px; padding: 28px 24px; min-height: 210px; text-align: start; display: grid; align-content: space-between; gap: 18px; box-shadow: var(--shadow); }
.big.private { background: var(--accent); color: var(--accent-ink); }
.big.business { background: var(--sea); color: var(--sea-ink); }
.big .t { font-family: var(--f-display); font-size: clamp(40px, 8vw, 64px); line-height: 1; }
.big .en { font-size: 14px; letter-spacing: .14em; opacity: .85; font-weight: 600; }
.big .s { font-size: 15px; opacity: .95; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; text-align: start; display: grid; gap: 4px; }
.tile b { font-size: 17px; }
.tile span { color: var(--muted); font-size: 14px; }
.tile:hover { border-color: var(--sea); }
@media (max-width: 560px) { .bigs { grid-template-columns: 1fr; } .big { min-height: 150px; } }

/* section toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar .grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 10px 16px; font-weight: 600; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* day sections */
.day { margin-bottom: 18px; }
.dayhead { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 10px 2px; text-align: start; }
.dayhead .chev { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); transition: transform .2s; flex: none; }
.day.closed .chev { transform: rotate(90deg); }
.dayhead .lbl { font-size: 21px; font-weight: 700; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.dayhead .rel { font-family: var(--f-display); font-weight: 400; color: var(--accent); font-size: 24px; }
.business-sec .dayhead .rel { color: var(--sea); }
.dayhead .cnt { margin-inline-start: auto; font-size: 14px; color: var(--muted); white-space: nowrap; }
.dayhead .cnt b { color: var(--ink); }
.day.overdue .lbl { color: var(--danger); }
.daynote { font-size: 13px; color: var(--muted); margin: -4px 42px 8px 0; }
.daysel { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin: 0 42px 8px 0; }
.list { display: grid; gap: 10px; }
.subhead { font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--pick-ink); margin: 8px 4px 0; }

/* order card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); scroll-margin-top: 90px; overflow: hidden; }
.card.pickup { background: var(--pick-bg); border-color: var(--pick-line); }
.card.packed:not(.open) { opacity: .62; }
.card.fired { border-inline-start: 4px solid var(--sea); }
.ch { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: stretch; }
.ch.nosel { grid-template-columns: minmax(0, 1fr) auto; }
.selbox { display: grid; place-items: center; padding-inline: 12px 4px; }
.selbox input { width: 24px; height: 24px; accent-color: var(--sea); }
.info { background: none; border: 0; text-align: start; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.l1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.onum { font-weight: 700; color: var(--muted); font-size: 15px; }
.oname { font-weight: 700; font-size: 18px; }
.l2 { color: var(--muted); font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.l2 .ph { color: var(--ink); font-weight: 500; direction: ltr; unicode-bidi: isolate; }
.l3 { font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.pick { background: var(--pick-line); color: var(--pick-ink); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.sea { background: var(--sea-soft); color: var(--sea); border-color: transparent; }
.chip.warn { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.chip.opt { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.packcell { display: grid; place-items: center; padding: 10px 14px; border-inline-start: 1px solid var(--line); }
.card.pickup .packcell { border-color: var(--pick-line); }
.packbox { width: 58px; height: 58px; border-radius: 12px; border: 3px solid var(--muted); background: var(--surface); display: grid; place-items: center; padding: 0; }
.packbox svg { width: 34px; height: 34px; opacity: 0; }
.packbox[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.packbox[aria-pressed="true"] svg { opacity: 1; stroke: var(--surface); }
.packbox.ready { border-color: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.packlbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin-top: 4px; text-align: center; }

.body { border-top: 1px solid var(--line); padding: 6px 16px 16px; background: var(--surface); }
.card.pickup .body { border-color: var(--pick-line); }
.items { display: grid; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.iname { font-weight: 600; font-size: 17px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.imeta { font-size: 14px; color: var(--muted); }
.qty { font-size: 20px; font-weight: 700; color: var(--ink); margin: 2px 0; }
.inote { font-size: 14px; background: var(--accent-soft); color: var(--ink); padding: 4px 8px; border-radius: 8px; margin-top: 4px; display: inline-block; }
.wcell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.winput { width: 110px; min-height: 52px; font-size: 22px; font-weight: 600; text-align: center; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); direction: ltr; font-variant-numeric: tabular-nums; }
.winput:focus { border-color: var(--accent); outline: none; }
.unit { color: var(--muted); font-size: 14px; }
.okbtn { min-height: 52px; min-width: 64px; border-radius: 10px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; padding: 0 14px; }
.final { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; color: var(--ok); }
.final small { font-size: 13px; color: var(--muted); font-weight: 500; }
.diff { font-size: 13px; font-weight: 600; }
.diff.pos { color: var(--danger); }
.diff.neg { color: var(--ok); }
.rm { background: none; border: 1px solid var(--line); border-radius: 8px; width: 40px; height: 40px; color: var(--danger); font-size: 20px; line-height: 1; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 12px; margin-top: 8px; background: var(--surface-2); border-radius: 10px; }
.addrow .field { flex: 1 1 200px; }
.addrow .field.amt { flex: 0 1 120px; }
.obar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px dashed var(--line); margin-top: 6px; }
.obar .grow { flex: 1; }
.total { font-size: 15px; color: var(--muted); }
.total b { color: var(--ink); font-size: 17px; }
.msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-weight: 600; font-size: 15px; }
.msg.bad { background: var(--danger-soft); color: var(--danger); }
.msg.good { background: var(--ok-soft); color: var(--ok); }
.msg.info { background: var(--sea-soft); color: var(--sea); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 6px; }
.toggle .sw { width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: inset-inline-start .2s; }
.toggle[aria-pressed="true"] .sw { background: var(--pick-ink); }
.toggle[aria-pressed="true"] .sw::after { inset-inline-start: 19px; }

/* motion */
.card.flash { animation: flash .9s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--ok); transform: scale(.985); } 40% { box-shadow: 0 0 0 6px var(--ok-soft); } 100% { box-shadow: var(--shadow); transform: none; } }
.body.opening { animation: drop .32s ease-out; }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.card.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(6px); } 40%, 80% { transform: translateX(-6px); } }
@media (prefers-reduced-motion: reduce) { .card.flash, .body.opening, .card.shake { animation: none; } .dayhead .chev, .toggle .sw, .toggle .sw::after { transition: none; } }

/* bulk bar */
.bulk { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--ink); color: var(--bg); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bulk .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 12px; }
.bulk .grow { flex: 1; font-weight: 600; }
.bulk .btn { min-height: 44px; }
.bulk .btn.light { background: var(--bg); color: var(--ink); border-color: var(--bg); }

/* tables (pages) */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.panel h2 { margin: 0; font-size: 20px; }
.panel p { margin: 0; color: var(--muted); }
.tscroll { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
table.t th { text-align: start; font-size: 13px; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.stop { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.stop .n { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; }
.stop.start .n { background: var(--accent); color: var(--accent-ink); }
.stops { display: grid; gap: 8px; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 1px dashed var(--line); border-radius: var(--r); }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 24, .55); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 16px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal.wide { width: min(760px, 100%); }
.modal h3 { margin: 0; font-size: 21px; text-wrap: balance; }
.modal p { margin: 0; color: var(--muted); }
.mact { display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap; padding-top: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 14px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 15px; min-height: 36px; }
.checks input { width: 20px; height: 20px; accent-color: var(--sea); }
.irow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(80px, 1fr) minmax(80px, 1fr) 44px; gap: 8px; align-items: end; }
.irow.np { grid-template-columns: minmax(0, 2fr) minmax(80px, 1fr) 44px; }
textarea.csv { width: 100%; min-height: 180px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; direction: ltr; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface-2); }
.toast { position: fixed; inset: auto 0 calc(24px + env(safe-area-inset-bottom, 0px)) 0; display: grid; place-items: center; z-index: 30; pointer-events: none; padding-inline: 16px; }
.toast div { background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; box-shadow: var(--shadow); max-width: 560px; text-align: center; }
.bulk ~ .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

@media (max-width: 560px) {
  .item { grid-template-columns: 1fr; }
  .wcell { justify-content: flex-start; }
  .packbox { width: 50px; height: 50px; }
  .info { padding: 12px; }
  .dayhead .lbl { font-size: 18px; }
  .daynote, .daysel { margin-inline-start: 0; }
  .irow, .irow.np { grid-template-columns: 1fr 1fr 44px; }
  .irow .f-prod { grid-column: 1 / -1; }
}
</style>

<script>
(function () {
"use strict";
document.documentElement.setAttribute("dir", "rtl");
document.documentElement.setAttribute("lang", "he");

/* ---------- dates (Israel time) ---------- */
const TZ = "Asia/Jerusalem";
const TODAY = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
const toD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const isoOf = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = toD(s); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const dow = s => toD(s).getUTCDay(); // 0 = Sunday
const isDelivDay = s => dow(s) >= 1 && dow(s) <= 5;
const isOpenDay = s => dow(s) !== 6;
const nextDeliv = (s, incl) => { let d = incl ? s : addDays(s, 1); while (!isDelivDay(d)) d = addDays(d, 1); return d; };
const prevDeliv = s => { let d = addDays(s, -1); while (!isDelivDay(d)) d = addDays(d, -1); return d; };
const nextSunday = s => { let d = addDays(s, 1); while (dow(d) !== 0) d = addDays(d, 1); return d; };
const DAYS = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
function dayParts(s) {
  const d = toD(s);
  const base = DAYS[dow(s)] + " " + d.getUTCDate() + "/" + (d.getUTCMonth() + 1);
  let rel = "";
  if (s === TODAY) rel = "היום";
  else if (s === addDays(TODAY, 1)) rel = "מחר";
  return { rel, base };

    '<div class="field"><label for="lp">סיסמה</label><input id="lp" name="p" type="password" dir="ltr" required></div>' +
    (ui.loginErr ? '<div class="err">' + esc(ui.loginErr) + '</div>' : "") +
    '<button class="btn primary" type="submit">כניסה</button>' +
    '<div class="hint"><b>פרטי כניסה לתצוגה</b><span>עובדים: basta / 1234 · מנהל: admin / 9999</span><div class="row"><button type="button" class="btn small" data-act="demo:employee">כניסה כעובד</button><button type="button" class="btn small" data-act="demo:admin">כניסה כמנהל</button></div></div>' +
    '</form></div></main>';
}

const TITLES = { home: "", private: "פרטי", business: "עסקי", deliver: "משלוחים", diffs: "הפרשי מחיר", trash: "סל מחזור", log: "יומן פעולות" };
function renderHeader() {
  return '<header class="top"><div class="wrap">' +
    '<button class="brand" data-act="go:home" aria-label="מסך הבית">בסטה</button>' +
    '<div class="crumb">' + esc(TITLES[ui.screen] || "") + '</div>' +
    (ui.screen !== "home" ? '<button class="ghost" data-act="go:home">חזרה</button>' : "") +
    '<span class="role ' + (isAdmin() ? "admin" : "") + '">' + (isAdmin() ? "מנהל" : "עובד") + '</span>' +
    '<button class="ghost" data-act="logout">יציאה</button>' +
    '</div></header>';
}

function renderScreen() {
  switch (ui.screen) {
    case "home": return renderHome();
    case "private": case "business": return renderSection(ui.screen);
    case "deliver": return renderDeliver();
    case "diffs": return isAdmin() ? renderDiffs() : "";
    case "trash": return isAdmin() ? renderTrash() : "";
    case "log": return isAdmin() ? renderLog() : "";
  }
  return "";
}

function homeCount(kind) {
  const g = sectionGroups(kind).filter(x => x.key !== "overdue")[0];
  if (!g) return "אין הזמנות פתוחות";
  const p = g.orders.filter(o => o.packed).length;
  return dayText(g.key) + ": " + g.orders.length + " הזמנות · " + p + " ארוזות";
}
function renderHome() {
  let h = '<div class="home"><div class="bigs">' +
    '<button class="big private" data-act="go:private"><span class="en">PRIVATE</span><span class="t">פרטי</span><span class="s num">' + esc(homeCount("private")) + '</span></button>' +
    '<button class="big business" data-act="go:business"><span class="en">BUSINESS</span><span class="t">עסקי</span><span class="s num">' + esc(homeCount("business")) + '</span></button>' +
    '</div><div class="tiles">' +
    '<button class="tile" data-act="go:deliver"><b>משלוחים</b><span>עצירות לפי יום משלוח</span></button>';
  if (isAdmin()) {
    const diffs = live().filter(o => o.kind === "private" && o.packed && orderDiff(o) !== 0).length;
    h += '<button class="tile" data-act="go:diffs"><b>הפרשי מחיר</b><span class="num">' + diffs + ' הזמנות עם הפרש</span></button>' +
      '<button class="tile" data-act="go:trash"><b>סל מחזור</b><span class="num">' + S.orders.filter(o => o.deleted).length + ' הזמנות שנמחקו</span></button>' +
      '<button class="tile" data-act="go:log"><b>יומן פעולות</b><span>מי עשה מה ומתי</span></button>';
  }
  return h + '</div></div>';
}

function renderSection(kind) {
  const groups = sectionGroups(kind);
  let h = '<div class="' + kind + '-sec"><div class="toolbar">';
  if (isAdmin()) {
    h += '<button class="btn primary small" data-act="new:' + kind + '">+ הזמנה חדשה</button>' +
      '<button class="btn small" data-act="selmode" aria-pressed="' + ui.selectMode + '">' + (ui.selectMode ? "סיום בחירה" : "בחירה מרובה") + '</button>';
    if (ui.selectMode) h += '<button class="btn small" data-act="selall:' + kind + '">בחירת כל ה' + (kind === "private" ? "פרטיות" : "עסקיות") + '</button>';
  }
  h += '<span class="grow"></span><div class="seg" role="group" aria-label="מעבר בין חלקים"><button data-act="go:private" aria-pressed="' + (kind === "private") + '">פרטי</button><button data-act="go:business" aria-pressed="' + (kind === "business") + '">עסקי</button></div></div>';
  if (!groups.length) h += '<div class="empty">אין הזמנות פתוחות</div>';
  groups.forEach((g, gi) => {
    const open = dayIsOpen(kind, g.key, gi);
    const packed = g.orders.filter(o => o.packed).length;
    const parts = g.key === "overdue" ? { rel: "באיחור", base: "מימים קודמים" } : dayParts(g.key);
    h += '<section class="day ' + (open ? "" : "closed ") + (g.key === "overdue" ? "overdue" : "") + '">' +
      '<button class="dayhead" data-act="day:' + kind + ':' + g.key + '" aria-expanded="' + open + '"><span class="chev">' + CHEV + '</span>' +
      '<span class="lbl">' + (parts.rel ? '<span class="rel">' + parts.rel + '</span>' : "") + '<span class="num">' + esc(parts.base) + '</span></span>' +
      '<span class="cnt num"><b>' + packed + '</b> / ' + g.orders.length + ' ארוזות</span></button>';
    if (open) {
      if (g.key !== "overdue" && dow(g.key) === 0) h += '<div class="daynote">יום ראשון: איסוף עצמי בלבד</div>';
      if (ui.selectMode && isAdmin()) h += '<label class="daysel"><input type="checkbox" data-act="selday:' + kind + ':' + g.key + '" ' + (g.orders.every(o => ui.selected.has(o.id)) ? "checked" : "") + '> בחירת כל היום</label>';
      h += '<div class="list">';
      let pickHead = false;
      g.orders.forEach(o => {
        if (o.pickup && !pickHead) { h += '<div class="subhead">איסוף עצמי</div>'; pickHead = true; }
        h += renderCard(o);
      });
      h += '</div>';
    }
    h += '</section>';
  });
  return h + '</div>';
}

function renderCard(o) {
  const open = ui.open.has(o.id);
  const sel = ui.selectMode && isAdmin();
  const cls = ["card", o.pickup ? "pickup" : "", o.packed ? "packed" : "", open ? "open" : "", o.fired ? "fired" : "", ui.flash === o.id ? "flash" : "", ui.shake === o.id ? "shake" : ""].join(" ");
  const allConfirmed = o.items.length && o.items.every(i => i.confirmed);
  let info;
  if (o.kind === "private") {
    info = '<span class="l1"><span class="onum num">#' + esc(o.num) + '</span><span class="oname">' + esc(o.name) + '</span>' +
      (o.pickup ? '<span class="chip pick">איסוף עצמי</span>' : "") + '<span class="chip num">' + esc(o.window) + '</span>' +
      (o.source === "manual" ? '<span class="chip">ידני</span>' : "") + '</span>' +
      '<span class="l2"><span class="ph num">' + esc(o.phone) + '</span>' + (o.addr ? '<span>' + esc(fullAddr(o.addr)) + '</span>' : "") + '</span>';
  } else {
    const c = client(o.cid);
    info = '<span class="l1"><span class="onum num">' + esc(o.num) + '</span><span class="oname">' + esc(c.business) + '</span>' +
      (o.pickup ? '<span class="chip pick">איסוף עצמי</span>' : "") +
      (o.fired ? '<span class="chip sea num">הופקה · מורנינג #' + esc(o.fired.doc) + '</span>' : "") + '</span>' +
      '<span class="l2"><span>' + esc(c.contact) + '</span><span class="ph num">' + esc(c.phone) + '</span>' + (o.pickup ? "" : '<span>' + esc(fullAddr(c.addr)) + '</span>') + '</span>' +
      '<span class="l3 num">' + esc(c.legal) + ' · ח.פ. ' + esc(c.hp) + '</span>';
  }
  if (o.packed && o.kind === "private" && isAdmin()) { const d = orderDiff(o); if (d) info = info.replace('</span><span class="l2">', '<span class="chip ' + (d > 0 ? "warn" : "ok") + ' num">הפרש ' + (d > 0 ? "לחיוב " : "לזיכוי ") + nis(Math.abs(d)) + '</span></span><span class="l2">'); }
  let h = '<article class="' + cls + '" id="card-' + o.id + '"><div class="ch ' + (sel ? "" : "nosel") + '">';
  if (sel) h += '<label class="selbox"><input type="checkbox" aria-label="בחירת הזמנה ' + esc(o.num) + '" data-act="sel:' + o.id + '" ' + (ui.selected.has(o.id) ? "checked" : "") + '></label>';
  h += '<button class="info" data-act="toggle:' + o.id + '" aria-expanded="' + open + '">' + info + '</button>' +
    '<div class="packcell"><div><button class="packbox ' + (!o.packed && allConfirmed ? "ready" : "") + '" data-act="pack:' + o.id + '" aria-pressed="' + o.packed + '" aria-label="' + (o.packed ? "ארוזה. לחיצה לביטול אריזה" : "סימון כארוזה") + '">' + CHECK + '</button><div class="packlbl">' + (o.packed ? "ארוזה" : "ארוזה?") + '</div></div></div></div>';
  if (open) h += renderBody(o);
  return h + '</article>';
}

function renderBody(o) {
  const editing = ui.editing.has(o.id);
  const locked = !!o.fired;
  let h = '<div class="body ' + (ui.opening === o.id ? "opening" : "") + '"><div class="items">';
  o.items.forEach(it => {
    const key = o.id + ":" + it.id;
    const p = ppuOf(o, it);
    const siteQty = o.kind === "private" && it.count && !it.added ? '<div class="qty num">כמות באתר: ' + fmt(it.count) + '</div>' : "";
    let meta = it.unit === "kg"
      ? (siteQty ? "משקל משוער: " + kg(it.kg) + " ק״ג" : "הוזמן " + kg(it.kg) + " ק״ג")
      : (siteQty ? "" : "הוזמנו " + fmt(it.count) + " יח׳");
    if (it.added) meta = "נוסף בעת האריזה";
    if (isAdmin() && p != null) meta += (meta ? " · " : "") + nis(p) + (it.unit === "kg" ? "/ק״ג" : "/יח׳");
    h += '<div class="item"><div><div class="iname">' + esc(it.name) + (it.option ? '<span class="chip opt">' + esc(it.option) + '</span>' : "") +
      (isAdmin() && o.kind === "business" && p == null ? '<span class="chip warn">אין מחיר שמור</span>' : "") + '</div>' +
      siteQty + (meta ? '<div class="imeta num">' + esc(meta) + '</div>' : "") + (it.note ? '<div class="inote">הערת לקוח: ' + esc(it.note) + '</div>' : "") +
      (ui.errs[key] ? '<div class="err">' + esc(ui.errs[key]) + '</div>' : "") + '</div><div class="wcell">';
    if (it.confirmed && !editing) {
      h += '<span class="final num">' + CHECK.replace('<svg', '<svg width="20" height="20" stroke="currentColor"') + amtText(it, it.final) + '</span>';
      if (isAdmin() && o.kind === "private") { const d = itemDiff(o, it); if (Math.abs(d) >= 0.01) h += '<span class="diff num ' + (d > 0 ? "pos" : "neg") + '">' + (d > 0 ? "+" : "") + nis(d) + '</span>'; }
    } else if (!locked) {
      const val = ui.drafts[key] != null ? ui.drafts[key] : (it.final != null ? it.final : "");
      h += '<input class="winput" id="w-' + key + '" data-key="' + key + '" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="' + (it.unit === "kg" ? "משקל סופי" : "כמות סופית") + ' ' + esc(it.name) + '" value="' + esc(val) + '"><span class="unit">' + unitLbl(it) + '</span>' +
        '<button class="okbtn" data-act="ok:' + key + '">אישור</button>';
      if (editing) h += '<button class="rm" data-act="rm:' + key + '" aria-label="הסרת ' + esc(it.name) + '">×</button>';
    }
    h += '</div></div>';
  });
  if (!o.items.length) h += '<div class="empty">אין פריטים</div>';
  h += '</div>';
  if (editing && !locked) {
    const a = ui.adding[o.id] || {};
    h += '<div class="addrow"><div class="field"><label for="ap-' + o.id + '">הוספת מוצר</label><select id="ap-' + o.id + '" data-addp="' + o.id + '"><option value="">בחירת מוצר…</option>' +
      PRODUCTS.map(p => '<option ' + (a.p === p.name ? "selected" : "") + '>' + esc(p.name) + '</option>').join("") + '</select></div>' +
      '<div class="field amt"><label for="aa-' + o.id + '">' + (a.p && prod(a.p).unit === "unit" ? "כמות (יח׳)" : "כמות (ק״ג)") + '</label><input id="aa-' + o.id + '" data-adda="' + o.id + '" inputmode="decimal" dir="ltr" value="' + esc(a.a || "") + '"></div>' +
      '<button class="btn small sea" data-act="add:' + o.id + '">הוספה</button></div>';
  }
  if (ui.notes[o.id]) h += '<div class="msg ' + ui.notes[o.id].cls + '">' + esc(ui.notes[o.id].text) + '</div>';
  h += '<div class="obar">';
  if (o.kind === "business" && !locked) h += '<button class="toggle" data-act="pickup:' + o.id + '" aria-pressed="' + o.pickup + '"><span class="sw"></span>איסוף עצמי</button>';
  if (!locked) h += '<button class="btn small" data-act="edit:' + o.id + '">' + (editing ? "סיום עריכה" : "עריכה") + '</button>';
  h += '<span class="grow"></span>';
  if (isAdmin()) {
    if (o.kind === "private") { if (o.packed) { const d = orderDiff(o); h += '<span class="total num">הפרש: <b>' + (d ? (d > 0 ? "לחיוב " : "לזיכוי ") + nis(Math.abs(d)) : "אין") + '</b></span>'; } }
    else { const bt = bizTotal(o); h += '<span class="total num">סה״כ ' + (o.packed ? "" : "משוער ") + ': <b>' + nis(bt.total) + '</b>' + (bt.missing.length ? " (חסרים מחירים)" : "") + '</span>'; }
    if (!locked) h += '<button class="btn small" data-act="details:' + o.id + '">פרטי הזמנה</button><button class="btn small" data-act="del:' + o.id + '" style="color:var(--danger)">מחיקה</button>';
    if (o.kind === "business" && !o.fired) h += '<button class="btn small sea" data-act="fire:' + o.id + '" ' + (o.packed ? "" : 'title="יש לארוז קודם"') + '>FIRE</button>';
  }
  h += '</div>';
  if (locked) h += '<div class="msg info">ההזמנה הופקה כתעודת משלוח במורנינג ולכן נעולה. תיקונים נעשים במורנינג.</div>';
  return h + '</div>';
}

function renderBulk() {
  const sel = [...ui.selected].map(byId).filter(Boolean);
  const p = sel.filter(o => o.kind === "private").length, b = sel.length - p;
  return '<div class="bulk"><div class="wrap"><span class="grow num">נבחרו ' + sel.length + (sel.length ? ' (' + p + ' פרטיות · ' + b + ' עסקיות)' : "") + '</span>' +
    '<button class="btn small light" data-act="selclear" ' + (sel.length ? "" : "disabled") + '>ניקוי</button>' +
    '<button class="btn small light" data-act="bulkcsv" ' + (sel.length ? "" : "disabled") + '>ייצוא CSV</button>' +
    '<button class="btn small danger" data-act="bulkdel" ' + (sel.length ? "" : "disabled") + '>מחיקה</button></div></div>';
}

function renderDeliver() {
  const days = [...new Set(live().filter(o => !o.pickup && o.date >= TODAY && isDelivDay(o.date)).map(o => o.date))].sort();
  const day = ui.deliverDay && days.includes(ui.deliverDay) ? ui.deliverDay : days[0];
  let h = '<div class="toolbar"><div class="seg" role="group" aria-label="יום משלוח">' + days.map(d => '<button class="num" data-act="dday:' + d + '" aria-pressed="' + (d === day) + '">' + esc(dayText(d)) + '</button>').join("") + '</div><span class="grow"></span>' +
    '<button class="btn small" disabled title="יתווסף בשלב 4">ייצוא PDF</button></div>';
  if (!day) return h + '<div class="empty">אין משלוחים מתוכננים</div>';
  const stops = sortedDay(live().filter(o => o.date === day && !o.pickup));
  const unpacked = stops.filter(o => !o.packed).length;
  h += '<div class="panel" style="margin-bottom:14px"><h2 class="num">' + esc(dayText(day)) + ' · ' + stops.length + ' עצירות</h2>' +
    '<p>בשלב 4 המסלול יחושב אוטומטית ב-Google Maps מנקודת היציאה, עם גרירה לשינוי הסדר וייצוא PDF לנהג. בתצוגה הזו העצירות מסודרות לפי מספר הזמנה.</p>' +
    (unpacked ? '<div class="msg bad num">' + unpacked + ' הזמנות עדיין לא ארוזות</div>' : '<div class="msg good">כל ההזמנות ארוזות</div>') + '</div>';
  h += '<div class="stops"><div class="stop start"><span class="n">⌂</span><div><b>יציאה</b><div class="imeta">מקווה ישראל 22, תל אביב</div></div><span></span></div>';
  stops.forEach((o, i) => {
    const c = o.kind === "business" ? client(o.cid) : null;
    h += '<div class="stop"><span class="n num">' + (i + 1) + '</span><div style="min-width:0"><b>' + esc(oName(o)) + '</b> <span class="onum num">' + (o.kind === "private" ? "#" : "") + esc(o.num) + '</span>' +
      '<div class="imeta">' + esc(fullAddr(c ? c.addr : o.addr)) + '</div><div class="imeta num">' + esc(c ? c.phone : o.phone) + ' · ' + o.items.length + ' פריטים' + (o.window ? " · " + esc(o.window) : "") + '</div></div>' +
      (o.packed ? '<span class="chip ok">ארוזה</span>' : '<span class="chip warn">לא ארוזה</span>') + '</div>';
  });
  h += '<div class="stop start"><span class="n">⌂</span><div><b>חזרה לחנות</b><div class="imeta">ברירת מחדל, ניתן לשנות בהגדרות המנהל</div></div><span></span></div></div>';
  return h;
}

function renderDiffs() {
  const os = live().filter(o => o.kind === "private" && o.packed && orderDiff(o) !== 0).sort((a, b) => a.date < b.date ? -1 : 1);
  const sum = os.reduce((s, o) => s + orderDiff(o), 0);
  let h = '<div class="panel"><h2>הפרשי מחיר בהזמנות פרטיות</h2><p>חיובי = הלקוח צריך להשלים תשלום. שלילי = זיכוי ללקוח. דמי משלוח לא נכללים.</p>' +
    '<div class="toolbar" style="margin:0"><span class="total num">סה״כ נטו: <b>' + nis(sum) + '</b></span><span class="grow"></span><button class="btn small sea" data-act="diffcsv" ' + (os.length ? "" : "disabled") + '>ייצוא CSV</button></div>';
  if (!os.length) return h + '<div class="empty">אין עדיין הפרשים. הם יופיעו כאן אחרי אריזת הזמנות שמשקלן הסופי שונה מההזמנה.</div></div>';
  h += '<div class="tscroll"><table class="t"><thead><tr><th>הזמנה</th><th>יום</th><th>לקוח</th><th>טלפון</th><th>פירוט</th><th>הפרש</th></tr></thead><tbody>';
  os.forEach(o => {
    const lines = o.items.filter(it => Math.abs(itemDiff(o, it)) >= 0.01).map(it => it.name + ": " + (it.added ? "נוסף " : amtText(it, ordered(it)) + " → ") + amtText(it, it.final)).concat(o.removed.filter(r => !r.added).map(r => r.name + ": הוסר"));
    const d = orderDiff(o);
    h += '<tr><td class="num">#' + esc(o.num) + '</td><td class="num">' + esc(dayParts(o.date).base) + '</td><td>' + esc(o.name) + '</td><td class="num" dir="ltr">' + esc(o.phone) + '</td><td style="font-size:13px;color:var(--muted)">' + lines.map(esc).join("<br>") + '</td><td class="num" style="font-weight:700;color:' + (d > 0 ? "var(--danger)" : "var(--ok)") + '">' + (d > 0 ? "+" : "") + nis(d) + '</td></tr>';
  });
  return h + '</tbody></table></div></div>';
}

function renderTrash() {
  const os = S.orders.filter(o => o.deleted).sort((a, b) => b.deleted - a.deleted);
  let h = '<div class="panel"><h2>סל מחזור</h2><p>הזמנות שנמחקו נשמרות 30 יום ואפשר לשחזר אותן.</p>';
  if (!os.length) return h + '<div class="empty">סל המחזור ריק</div></div>';
  h += '<div class="tscroll"><table class="t"><thead><tr><th>הזמנה</th><th>לקוח</th><th>יום</th><th>נמחקה</th><th></th></tr></thead><tbody>';
  os.forEach(o => {
    const left = 30 - Math.floor((Date.now() - o.deleted) / 864e5);
    h += '<tr><td class="num">' + esc(o.kind === "private" ? "#" + o.num : o.num) + '</td><td>' + esc(oName(o)) + '</td><td class="num">' + esc(dayParts(o.date).base) + '</td><td class="num">נותרו ' + left + ' ימים</td><td><button class="btn small" data-act="restore:' + o.id + '">שחזור</button></td></tr>';
  });
  return h + '</tbody></table></div></div>';
}

function renderLog() {
  let h = '<div class="panel"><h2>יומן פעולות</h2><p>בשלב זה יש כניסה משותפת לעובדים, לכן היומן מציין "עובד" או "מנהל".</p>';
  if (!S.log.length) return h + '<div class="empty">אין עדיין פעולות</div></div>';
  h += '<div class="tscroll"><table class="t"><thead><tr><th>זמן</th><th>מי</th><th>פעולה</th><th>הזמנה</th></tr></thead><tbody>';

/* ---------- CSV ---------- */
const csvCell = v => { const s = String(v == null ? "" : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const statusOf = o => o.fired ? "הופקה" : o.packed ? "ארוזה" : "חדשה";
function rowsFor(o, keys, diffMode) {
  const c = o.kind === "business" ? client(o.cid) : null;
  const base = {
    num: o.num, kind: o.kind === "private" ? "פרטי" : "עסקי", date: o.date, mode: o.pickup ? "איסוף עצמי" : "משלוח", window: o.window || "",
    name: c ? c.contact : o.name, business: c ? c.business : "", company: c ? c.legal + " " + c.hp : "", phone: c ? c.phone : o.phone,
    address: fullAddr(c ? c.addr : o.addr), status: statusOf(o), doc: o.fired ? o.fired.doc + (o.fired.preview ? " (תצוגה)" : "") : "", odiff: orderDiff(o).toFixed(2)
  };
  const out = [];
  const itemRow = (it, removed) => {
    const p = ppuOf(o, it);
    const r = Object.assign({}, base, { item: it.name + (removed ? " (הוסר)" : it.added ? " (נוסף)" : ""), option: it.option, note: it.note, ordered: it.added ? "" : ordered(it), unit: unitLbl(it), final: removed ? 0 : (it.confirmed ? it.final : ""), ppu: p == null ? "" : Math.round(p * 100) / 100, diff: o.kind !== "private" ? "" : removed ? (it.added ? 0 : -it.price).toFixed(2) : it.confirmed ? itemDiff(o, it).toFixed(2) : "" });
    out.push(keys.map(k => csvCell(r[k])).join(","));
  };
  o.items.forEach(it => { if (!diffMode || Math.abs(itemDiff(o, it)) >= 0.01) itemRow(it, false); });
  o.removed.forEach(it => itemRow(it, true));
  return out;
}
function buildCSV(sections, keys, cols, diffMode) {
  const lines = [];
  sections.forEach((sec, i) => {
    if (i > 0) lines.push("", "");
    lines.push(keys.map(k => csvCell(cols.find(c => c[0] === k)[1])).join(","));
    sec.forEach(o => lines.push(...rowsFor(o, keys, diffMode)));
  });
  return "﻿" + lines.join("\r\n");
}
async function deliverCSV(text, filename) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); ui.modal = null; toast("הקובץ נשמר"); return; }
    catch (e) { if (e && e.code === "declined") { ui.modal = null; toast("השמירה בוטלה"); return; } }
  }
  ui.modal = { type: "csvtext", text: text.replace(/^﻿/, ""), wide: true }; render();
}
async function runCSV() {
  const m = ui.modal;
  const cols = m.mode === "diffs" ? DIFF_COLS : COLS;
  const keys = cols.map(c => c[0]).filter(k => { const el = document.getElementById("col-" + k); return el && el.checked; });
  if (!keys.length) { m.err = "בחרו לפחות עמודה אחת"; render(); return; }
  let sections, name;
  if (m.mode === "diffs") {
    sections = [live().filter(o => o.kind === "private" && o.packed && orderDiff(o) !== 0)];
    name = "basta-price-differences-" + TODAY + ".csv";
  } else {
    const wantP = document.getElementById("x-private") && document.getElementById("x-private").checked;
    const wantB = document.getElementById("x-business") && document.getElementById("x-business").checked;
    if (!wantP && !wantB) { m.err = "בחרו פרטיות, עסקיות או את שתיהן"; render(); return; }
    const sel = [...ui.selected].map(byId).filter(Boolean);
    sections = [];
    if (wantP) sections.push(sortedDay(sel.filter(o => o.kind === "private")));
    if (wantB) sections.push(sortedDay(sel.filter(o => o.kind === "business")));
    name = "basta-orders-" + TODAY + ".csv";
